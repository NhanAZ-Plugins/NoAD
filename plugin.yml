name: NoAD
main: Vaivez66\NoAdvertisingPE\NoAdvertising
version: 2.0.0
api: 5.0.0
load: POSTWORLD
authors: [Vaivez66]
description: Filter configured server-advertising domains from chat, signs and selected commands.

commands:
  na:
    description: Manage NoAD's blocked-domain list.
    usage: "§e/na <add|remove|list> [domain]"
    permission: "no.advertising.pe"
    
permissions:
  no.advertising.pe:
    description: Allows managing NoAD's blocked-domain list.
    default: op
    
  no.advertising.pe.bypass:
    description: Bypasses NoAD chat, sign and selected-command filters.
    default: false
    
