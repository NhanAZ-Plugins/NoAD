# Chat moderation actions:
#   - broadcast
#   - block
#   - kick
type: block
# block keeps the message private and informs the sender.

# Tin Nhắn Sẽ Gửi:
# Bạn Có Thể Sử Dụng {player} Để Đề Cập Đến Tên Cua Họ
message: '§cVui Lòng Không Quảng Cáo!'

# Blocked host rules. A leading dot matches a host suffix (for example, .com).
domain:
  - ".me"
  - ".com"
  - ".net"
  
# Allowed hosts and their subdomains. This does not allow other blocked hosts
# that happen to appear in the same message.
allowed.domain:
  - "minesao.sytes.net"
  
# Enable sign filtering.
detect.sign: true

# Sign text that replaces all four lines if a blocked host is detected.
lines:
  - '§c============='
  - '§cVui Lòng Không Quảng Cáo!'
  - '§c============='
  - ''
# Filter blocked host text in the arguments of these selected commands.
blocked.cmd:
  - "/me"
  - "/tell"
